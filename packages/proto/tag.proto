syntax = "proto3";

message FloatArray { repeated float values = 1; }
message Int32Array { repeated int32 values = 1; }

message TagValue {
  oneof value {
    float      float_value       = 1;
    bool       bool_value        = 3;
    int32      int_value         = 4;
    string     string_value      = 5;
    FloatArray float_array_value = 6;
    Int32Array int_array_value   = 7;
  }
}

message TagSample {
  uint32   tag_id = 1;
  TagValue value  = 2;
}

message TelemetryMessage {
  uint64           timestamp = 1;
  string           status    = 2;
  repeated TagSample tags    = 3;
}
