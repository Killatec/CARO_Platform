syntax = "proto3";

message TagValue {
  oneof value {
    double float_value  = 1;
    int32  int_value    = 2;
    bool   bool_value   = 3;
    string string_value = 4;
  }
}

message TagSample {
  uint32   tag_id = 1;
  TagValue value  = 2;
}

message TelemetryMessage {
  uint64           timestamp = 1;
  string           status    = 2;
  repeated TagSample tags    = 3;
}
